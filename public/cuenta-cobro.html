<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cuenta de cobro · León Telecom</title>
<style>
  :root{
    --azul:#1E5AA8; --azul-claro:#2E7BD6; --tinta:#12181F; --cuerpo:#3D4753;
    --apag:#6B7684; --papel:#F6F8FB; --tarjeta:#FFFFFF; --linea:#DFE5EC;
    --bien:#1B7F4C; --ojo:#B45309;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--papel);
    color:var(--cuerpo);min-height:100vh;display:grid;place-items:center;padding:28px 20px;-webkit-font-smoothing:antialiased}
  .caja{max-width:520px;width:100%;background:var(--tarjeta);border:1px solid var(--linea);
    border-radius:16px;padding:34px 32px;box-shadow:0 18px 44px -24px rgba(18,24,31,.25)}
  .marca{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--azul);font-weight:800;margin-bottom:20px}
  .paloma{width:52px;height:52px;border-radius:50%;background:#E7F4EC;display:grid;place-items:center;margin-bottom:18px}
  .paloma svg{stroke:var(--bien);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
  h1{font-size:23px;line-height:1.25;color:var(--tinta);margin-bottom:12px;letter-spacing:-.3px}
  p{font-size:15px;line-height:1.65;margin-bottom:14px}
  strong{color:var(--tinta)}
  .nota{background:var(--papel);border:1px solid var(--linea);border-radius:11px;padding:15px 17px;margin:18px 0 0}
  .nota h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--apag);margin-bottom:9px;font-weight:700}
  .nota p{font-size:14px;margin:0}
  .pie{margin-top:24px;padding-top:16px;border-top:1px solid var(--linea);font-size:13px;color:var(--apag)}
  ul{margin:8px 0 0 20px} li{font-size:14px;line-height:1.7;margin-bottom:4px}
</style>
</head>
<body>
<div class="caja" id="caja">
  <div class="marca">León Telecom</div>
  <div id="contenido"><p>Revisando cómo quedó tu cuenta…</p></div>
</div>

<script>
/*
 * ESTA PANTALLA DECÍA SIEMPRE "LISTO, RECIBIMOS TUS DATOS".
 *
 * Stripe regresa aquí en tres situaciones distintas y solo una de ellas es
 * buena: cuando terminó y quedó aprobado, cuando terminó pero Stripe todavía
 * le pide algo, y cuando el enlace se venció antes de que llenara nada.
 *
 * Decirle "listo" en los tres casos es lo peor que se puede hacer con alguien
 * que acaba de dedicar diez minutos a teclear su RFC y su cuenta de banco: se
 * va tranquilo creyendo que ya, y se entera semanas después de que nunca quedó.
 *
 * Así que se le pregunta al servidor cómo está de verdad, y se le dice eso.
 */
const marca = new URLSearchParams(location.search).get('estado') || '';
const caja = document.getElementById('contenido');

const paloma = '<div class="paloma"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 7"/></svg></div>';
const pie = (t) => `<div class="pie">${t}</div>`;

function pinta(html) { caja.innerHTML = html; }

/*
 * Lo que pide Stripe, en español. Contesta con códigos suyos, y este es justo
 * el momento en que él necesita entender qué le falta para resolverlo solo.
 */
const PALABRAS = [
  [/verification\.document|identity\.document/i, 'una foto de tu identificación'],
  [/verification\.additional_document/i, 'un comprobante de domicilio'],
  [/tax_id|rfc/i, 'tu RFC'],
  [/external_account|bank_account/i, 'tu cuenta de banco (CLABE)'],
  [/business_profile\.url|business_url/i, 'la página o red social de tu negocio'],
  [/business_profile\.mcc|product_description/i, 'a qué se dedica tu negocio'],
  [/address/i, 'tu domicilio'],
  [/phone/i, 'tu teléfono'],
  [/dob|date_of_birth/i, 'tu fecha de nacimiento'],
  [/representative/i, 'los datos de quien representa a la empresa'],
  [/owners|directors/i, 'los datos de los socios'],
  [/company\.name|business_name/i, 'el nombre fiscal de la empresa'],
];
function enEspanol(codigo) {
  const c = String(codigo || '');
  for (const [re, texto] of PALABRAS) if (re.test(c)) return texto;
  return c;
}

function quedoListo() {
  pinta(paloma + `
    <h1>Listo, tu cuenta ya puede recibir pagos</h1>
    <p>
      Stripe aprobó tu información. A partir de ahora, el dinero de cada cliente que
      pague en línea <strong>cae directo en tu cuenta bancaria</strong>, sin pasar por
      nadie más y sin descuentos de nuestra parte.
    </p>
    <div class="nota">
      <h2>Qué sigue</h2>
      <ul>
        <li>Tus clientes no notan nada hasta que lo activemos juntos.</li>
        <li>Tú decides con cuántos empezamos.</li>
      </ul>
    </div>` + pie('Ya puedes cerrar esta pestaña.'));
}

function faltaAlgo(faltante) {
  pinta(`
    <h1>Se guardó lo que llenaste, pero falta un paso</h1>
    <p>
      Stripe todavía te pide algo más antes de aprobar tu cuenta.
      <strong>Mientras no lo completes, el cobro en línea no funciona</strong> y tus
      clientes siguen pagando como siempre.
    </p>
    ${faltante && faltante.length ? `<div class="nota"><h2>Lo que falta</h2><ul>${
      faltante.slice(0, 5).map((f) => '<li>' + enEspanol(f).replace(/[<>&]/g, '') + '</li>').join('')
    }</ul></div>` : ''}
    <p style="margin-top:14px">
      Entra a tu panel, sección <strong>Cobranza</strong>, y pícale a
      <strong>“Continuar donde me quedé”</strong>. Retomas justo donde lo dejaste.
    </p>` + pie('Si no te queda claro qué te está pidiendo, escríbenos y lo vemos juntos.'));
}

function seVencio() {
  pinta(`
    <h1>El enlace se venció</h1>
    <p>
      Por seguridad, el enlace del alta dura poco. <strong>No perdiste nada</strong>:
      lo que hayas llenado se guardó.
    </p>
    <p>
      Entra a tu panel, sección <strong>Cobranza</strong>, y vuelve a abrirlo desde ahí.
    </p>` + pie('Si te sigue pasando, escríbenos y te mandamos uno nuevo.'));
}

function noSeSupo() {
  pinta(`
    <h1>Recibimos tus datos</h1>
    <p>
      No pudimos confirmar en este momento si Stripe ya los aprobó.
      <strong>Revisa tu panel</strong>, en la sección Cobranza: ahí siempre aparece el
      estado real de tu cuenta.
    </p>` + pie('Ya puedes cerrar esta pestaña.'));
}

(async () => {
  if (marca === 'reintentar') return seVencio();
  try {
    /*
     * Se pregunta por el estado PÚBLICO, sin sesión: quien llega aquí viene del
     * sitio de Stripe, no del panel, y no trae token. La respuesta no dice nada
     * privado, solo si esa cuenta ya puede cobrar y qué le falta.
     */
    const r = await fetch('/api/cuenta-cobro/estado', { cache: 'no-store' });
    const d = await r.json();
    if (!d || !d.ok || !d.existe) return noSeSupo();
    if (d.puedeCobrar) return quedoListo();
    return faltaAlgo(d.faltante);
  } catch (_) {
    noSeSupo();
  }
})();
</script>
</body>
</html>
